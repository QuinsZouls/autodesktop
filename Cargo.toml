[package]
name = "autodesktop"
version = "0.1.0"
edition = "2021"
description = "CLI tool for screenshot capture with grid overlay and remote input control"
license = "MIT"

[dependencies]
# Screenshot capture (latest version)
xcap = "0.9"

# Input control (mouse, keyboard)
enigo = { version = "0.2", features = ["serde"] }

# Core Graphics for mouse position (macOS)
core-graphics = "0.24"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Image processing
image = "0.25"
imageproc = "0.25"

# Font rendering for grid labels
ab_glyph = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Colors
rgb = "0.8"
